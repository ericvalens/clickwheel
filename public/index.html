<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title translate="no">Clickwheel</title>
    <meta name="description" content="A pocket music player with a working click wheel. Every song is synthesized live in your browser. Built with Web Components and Vercel's UI SDK." />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:title" content="Clickwheel" />
    <meta property="og:description" content="Spin the wheel. Every song is synthesized live in your browser." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='1' width='20' height='30' rx='4' fill='%23e3e6ea' stroke='%23999'/%3E%3Crect x='9' y='4' width='14' height='10' rx='1' fill='%232f78d8'/%3E%3Ccircle cx='16' cy='22' r='6' fill='%23fff' stroke='%23aaa'/%3E%3Ccircle cx='16' cy='22' r='2.2' fill='%23ddd'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Sizes the player before first paint, so it never jumps once app.js loads.
      ;(() => {
        const fit = () => {
          const h = innerHeight
          // Room for the hint under the player, and on narrow screens for the Source pill above it.
          const spare = (h >= 700 ? 92 : 32) + (innerWidth <= 700 ? 40 : 0)
          const s = Math.min((innerWidth - 32) / 340, (h - spare) / 566)
          document.documentElement.style.setProperty("--s", Math.max(0.5, Math.min(1.35, s)).toFixed(3))
        }
        fit()
        addEventListener("resize", fit)
      })()
    </script>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <a class="source-link" href="https://github.com/ericvalens/clickwheel" target="_blank" rel="noopener noreferrer" aria-label="View source on GitHub">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      Source
    </a>
    <main class="stage">
      <music-player aria-label="Clickwheel">
        <div class="device" data-body="silver">
          <ui-switch class="hold" aria-label="Hold"><ui-switch-thumb></ui-switch-thumb></ui-switch>
          <div class="bezel">
            <div class="screen">
              <div class="status">
                <span class="st-left" aria-hidden="true"></span>
                <span class="st-title"></span>
                <ui-meter class="batt" aria-label="Battery" value="82">
                  <ui-meter-track><ui-meter-indicator></ui-meter-indicator></ui-meter-track>
                </ui-meter>
              </div>
              <div class="panes"></div>
              <div class="glare" aria-hidden="true"></div>
            </div>
          </div>
          <click-wheel step="15" aria-label="Click wheel">
            <click-wheel-ring class="wheel">
              <click-wheel-button name="menu"><button class="lbl lbl-menu" type="button" aria-label="Menu" tabindex="-1">MENU</button></click-wheel-button>
              <click-wheel-button name="next"><button class="lbl lbl-next" type="button" aria-label="Next" tabindex="-1"><svg viewBox="0 0 24 12" width="21" height="10.5" aria-hidden="true"><path d="M1 1l8 5-8 5zM10 1l8 5-8 5z" /><rect x="19.2" y="1" width="2.4" height="10" /></svg></button></click-wheel-button>
              <click-wheel-button name="play"><button class="lbl lbl-play" type="button" aria-label="Play or pause" tabindex="-1"><svg viewBox="0 0 24 12" width="21" height="10.5" aria-hidden="true"><path d="M1 1l8 5-8 5z" /><rect x="13" y="1" width="3" height="10" /><rect x="19" y="1" width="3" height="10" /></svg></button></click-wheel-button>
              <click-wheel-button name="prev"><button class="lbl lbl-prev" type="button" aria-label="Previous" tabindex="-1"><svg viewBox="0 0 24 12" width="21" height="10.5" aria-hidden="true"><path d="M23 1l-8 5 8 5zM14 1L6 6l8 5z" /><rect x="2.4" y="1" width="2.4" height="10" /></svg></button></click-wheel-button>
              <click-wheel-center><button class="center" type="button" aria-label="Select" tabindex="-1"></button></click-wheel-center>
            </click-wheel-ring>
          </click-wheel>
        </div>
      </music-player>
      <p class="hint">
        <span class="touch">Drag around the wheel to scroll. Tap the center to select. MENU goes back.</span>
        <span class="keys">↑ ↓ scroll · ⏎ select · esc back · space play · ← → skip · type to jump</span>
      </p>
    </main>
  </body>
</html>
